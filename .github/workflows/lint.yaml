name: Lint

on:
  workflow_call:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    # Non-blocking until the pre-existing React Compiler rule violations are fixed.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn

      - run: yarn lint:check

  react-compiler:
    name: React Compiler
    runs-on: ubuntu-24.04
    # Non-blocking until the pre-existing compiler bailouts are fixed.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn

      - run: yarn react-compiler
