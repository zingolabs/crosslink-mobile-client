name: Android Release

on:
  push:
    tags: ['release-*']
  workflow_dispatch:

jobs:
  create-cache-key:
    uses: ./.github/workflows/create-cache-key.yaml

  android-build:
    strategy:
      matrix:
        arch: [x86_64, x86, arm64-v8a, armeabi-v7a]
    uses: ./.github/workflows/android-build.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      arch: ${{ matrix.arch }}

  android-release-apk:
    name: Build, sign and upload to Google Play
    needs: [create-cache-key, android-build]
    runs-on: ubuntu-24.04
    env:
      CACHE-KEY: ${{ needs.create-cache-key.outputs.cache-key }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read-only)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-write-only: false
          cache-read-only: true

      - name: Restore native rust for x86_64
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs/x86_64
          key: native-android-uniffi-x86_64-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Restore native rust for x86
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs/x86
          key: native-android-uniffi-x86-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Restore native rust for arm64-v8a
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: native-android-uniffi-arm64-v8a-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Restore native rust for armeabi-v7a
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs/armeabi-v7a
          key: native-android-uniffi-armeabi-v7a-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Restore kotlin uniffi
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/generated/source/uniffi/release/java/uniffi/zingo
          key: kotlin-android-uniffi-arm64-v8a-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Yarn install
        run: yarn

      - name: Ruby and bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Version from tag
        run: |
          echo "ARTIFACT_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/release-* ]]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#release-}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Google Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/Zingo.jks
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "${RUNNER_TEMP}/play-service-account.json"
          jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' \
            "${RUNNER_TEMP}/play-service-account.json" > /dev/null \
            || { echo "PLAY_SERVICE_ACCOUNT_JSON is not a Google service account key" >&2; exit 1; }
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=${RUNNER_TEMP}/play-service-account.json" >> "$GITHUB_ENV"

      - name: Build, sign and upload
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DELEGATOR_REPORT_URL: ${{ secrets.DELEGATOR_REPORT_URL }}
          DELEGATOR_REPORT_TOKEN: ${{ secrets.DELEGATOR_REPORT_TOKEN }}
        run: bundle exec fastlane android release

      - name: Collect artifacts
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
            "ZingoDelegator-${{ env.ARTIFACT_TAG }}.apk"
          mv android/app/build/outputs/bundle/release/app-release.aab \
            "ZingoDelegator-${{ env.ARTIFACT_TAG }}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZingoDelegator-${{ env.ARTIFACT_TAG }}-android
          path: |
            ZingoDelegator-${{ env.ARTIFACT_TAG }}.apk
            ZingoDelegator-${{ env.ARTIFACT_TAG }}.aab

      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZingoDelegator-${{ env.ARTIFACT_TAG }}.apk
            ZingoDelegator-${{ env.ARTIFACT_TAG }}.aab
