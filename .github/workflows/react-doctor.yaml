name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: yarn

      - name: Scan changed files
        uses: millionco/react-doctor@v2
        with:
          scope: changed
          blocking: error
          # Pinned so the action runs its own toolchain binary directly.
          # Without this it reuses the installed devDependency via `yarn exec`,
          # and Yarn 1 strips `--json` as its own flag, so no JSON report is
          # produced and the scan fails. Keep in sync with the devDependency.
          version: 0.9.18
